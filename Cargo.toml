[workspace]
resolver = "2"
members = [
  "crates/rw-core",
  "crates/rw-payments",
  "crates/rw-litd",
  "crates/rw-replay",
  "crates/rw-cli",
  "xtask",
]
default-members = [
  "crates/rw-core",
  "crates/rw-payments",
  "crates/rw-litd",
  "crates/rw-replay",
  "crates/rw-cli",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pauloes-btechs/rust-wallet"
authors = ["pauloes <pauloes@btechs.io>"]

[workspace.dependencies]
rw-core = { path = "crates/rw-core" }
rw-payments = { path = "crates/rw-payments", default-features = false }
rw-litd = { path = "crates/rw-litd" }
rw-replay = { path = "crates/rw-replay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bech32 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
tonic = { version = "0.14", features = ["tls-ring", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
