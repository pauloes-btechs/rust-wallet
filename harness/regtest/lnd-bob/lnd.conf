# lnd-bob: full-node LND on the harness bitcoind. Regtest throwaway.
[Application Options]
alias=rw-bob
rpclisten=0.0.0.0:10009
listen=0.0.0.0:9735
# The container's service name, so the cert is valid for in-network peers too.
tlsextradomain=lnd-bob
# Regtest only: create an unencrypted wallet on first start, no seed prompt.
noseedbackup=true
accept-keysend=true

[Bitcoin]
bitcoin.active=true
bitcoin.regtest=true
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=bitcoind:18443
bitcoind.rpcuser=regtest
bitcoind.rpcpass=regtest
bitcoind.zmqpubrawblock=tcp://bitcoind:28332
bitcoind.zmqpubrawtx=tcp://bitcoind:28333
