# litd, integrated mode, bitcoind backend. Regtest throwaway.
# Keys carried over from Sovereign Wallet's verified v0.17.8 harness:
# - lnd-mode=integrated (litd defaults to remote mode),
# - network=regtest via litd's own flag (not lnd.bitcoin.regtest),
# - autopilot.disable=true (no autopilot server off mainnet/testnet),
# - uipassword is mandatory.
uipassword=harness-regtest-password
lnd-mode=integrated
network=regtest
autopilot.disable=true
httpslisten=0.0.0.0:8443

lnd.rpclisten=0.0.0.0:19090
lnd.listen=0.0.0.0:9737
lnd.noseedbackup=true
lnd.tlsextradomain=litd

lnd.bitcoin.node=bitcoind
lnd.bitcoind.rpchost=bitcoind:18443
lnd.bitcoind.rpcuser=regtest
lnd.bitcoind.rpcpass=regtest
lnd.bitcoind.zmqpubrawblock=tcp://bitcoind:28332
lnd.bitcoind.zmqpubrawtx=tcp://bitcoind:28333
