name: Release (desktop installers)

# Tag vX.Y.Z (or run manually) → unsigned installers for macOS (Apple silicon
# + Intel), Windows (NSIS + MSI) and Linux (deb, AppImage) attached to a DRAFT
# GitHub Release. Each bundle carries the litd sidecar, fetched and verified
# against sidecars.lock.json for its own target. Signing: see docs/RELEASE.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Fetch + verify the litd sidecar for this target
        run: cargo xtask fetch-sidecars --triple ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: rust-wallet ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: |
            Unsigned development build (regtest/signet; mainnet disabled).
            macOS: right-click → Open the first time. See docs/RELEASE.md.
          releaseDraft: true
          prerelease: true
