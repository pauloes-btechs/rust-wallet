name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p rw-litd --features regtest --tests -- -D warnings
      - run: cargo test --workspace
      - name: rw CLI over the recorded litd session
        run: |
          cargo run -q -p rw-cli -- --replay status
          cargo run -q -p rw-cli -- --replay balance
          cargo run -q -p rw-cli -- --replay channels

