[package]
name = "rw-desktop"
description = "rust-wallet desktop: Tauri 2 shell around the Leptos UI and the litd gRPC backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rw_desktop_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rw-core.workspace = true
rw-litd.workspace = true
rw-payments = { workspace = true, features = ["sqlite"] }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hex.workspace = true
getrandom = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
tonic.workspace = true

[dev-dependencies]
tempfile = "3"
