[package]
name = "rw-litd"
description = "Live NodeApi over Lightning Labs' litd / LND gRPC (tonic), with pinned-cert TLS and macaroon auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Integration tests against the Docker regtest harness (harness/regtest).
regtest = []

[dependencies]
rw-core.workspace = true
rw-payments = { workspace = true, features = ["sqlite"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
tracing.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
http = "1"

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
