[package]
name = "rw-cli"
description = "rw: command-line rust-wallet over litd/LND (or the recorded regtest replay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rw"
path = "src/main.rs"

[dependencies]
rw-core.workspace = true
rw-payments = { workspace = true, features = ["sqlite"] }
rw-litd.workspace = true
rw-replay.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
